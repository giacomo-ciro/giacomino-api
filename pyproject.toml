[project]
name = "giacomino-api"
version = "1.0.0"
description = "API for Giacomo Ciro's personal chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "chromadb",
    "pyyaml",
    "together",
    "numpy",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in the signature
# default; that's the intended pattern, not the bug B008 flags.
"app/routes/*.py" = ["B008"]
